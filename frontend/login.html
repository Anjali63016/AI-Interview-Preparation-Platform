<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login</title>

<link rel="stylesheet" href="css/login.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="container">

<div class="left">

<img src="assets/images/aiimage.jpeg">

<h1>Welcome Back!</h1>

<p>
Login to continue your AI Interview Preparation journey.
</p>

</div>

<div class="right">

<div class="login-box">

<h2>Login</h2>

<form id="loginForm">

<input
type="email"
id="email"
placeholder="Email Address"
required>

<input
type="password"
id="password"
placeholder="Password"
required>

<button type="submit">
Login
</button>

</form>

<div class="options">

<label>

<input type="checkbox">

Remember Me

</label>

<a href="#">
Forgot Password?
</a>

</div>

<p>

Don't have an account?

<a href="register.html">

Register

</a>

</p>

</form>

</div>

</div>

</div>

<script src="js/login.js"></script>
</body>

</html>
